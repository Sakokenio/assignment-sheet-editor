<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waiter Briefing — Event Editor</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#182b3c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Assignment Editor"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#182331;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}.top{background:#182b3c;color:white;padding:17px 24px}.top h1{font-size:21px;margin:0 0 4px}.top p{margin:0;color:#d5e0e9;font-size:13px}.layout{display:grid;grid-template-columns:minmax(400px,1fr) minmax(360px,0.9fr);gap:18px;max-width:1500px;margin:18px auto;padding:0 16px}.card{background:white;border:1px solid #d8dfe5;border-radius:9px;padding:16px;margin-bottom:15px;box-shadow:0 2px 7px #172b3c09}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}input,textarea,select{width:100%;padding:8px;border:1px solid #c9d2da;border-radius:5px;font:13px Arial}textarea{min-height:58px;resize:vertical}.item{background:#f8fafb;border:1px solid #dce4e9;border-radius:6px;padding:10px;margin:9px 0}.nested{margin:7px 0 7px 13px;border-left:3px solid #d6e1e9;padding-left:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #a7b8c7;background:#fff;color:#172b3c;border-radius:5px;padding:8px 11px;cursor:pointer;font-weight:600;font-size:12px}.btn.primary{background:#234866;color:white;border-color:#234866}.btn.danger{color:#9b3030;border-color:#e5c7c7}.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #3983ba}.toolbar{position:sticky;top:0;background:#fff;border-bottom:1px solid #dce4e9;padding:10px 16px;z-index:10;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.toolbar small{color:#546477}.hint{font-size:12px;color:#5b6872;line-height:1.45}.preview{position:sticky;top:65px;max-height:calc(100vh - 90px);overflow:auto}.sheet{background:#fff;border:1px solid #c7cdd2;width:100%;max-width:612px;margin:auto;padding:30px 30px 35px;min-height:720px;font-family:Helvetica,Arial,sans-serif;color:#000;font-size:10px;line-height:1.2}.sheet h1{font-size:18px;margin:0 0 4px}.sheet .management{font-size:8px}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px 0}.timeline strong{display:block;font-size:9px}.timeline span{display:block;font-size:9px}.band{background:#ededed;padding:5px 7px;font-size:12px;font-weight:700;margin:10px -4px 8px}.pr{display:grid;grid-template-columns:135px 1fr;gap:9px;margin:3px 0}.pr .cat{font-size:9px;font-weight:bold;text-transform:uppercase}.pr .content{font-size:10px}.menurow{display:grid;grid-template-columns:75px 60px 1fr;gap:6px;margin:2px 0}.menurow .course{font-weight:bold;font-size:9px;text-transform:uppercase}.menurow .method{font-size:9px;font-style:italic}.menurow .desc{font-size:10px}.or{margin:3px 0 3px 140px;font-weight:bold;font-size:9px}.service{display:grid;grid-template-columns:135px 1fr;gap:9px;margin:4px 0}.service .trigger{font-weight:bold;font-size:9px}.service .instructions{font-size:10px}.assignment{font-size:11px;font-weight:bold;white-space:normal}.notice{background:#fff7e2;border:1px solid #e5cf8f;border-radius:6px;padding:10px;font-size:12px;margin-bottom:12px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.preview{position:static;max-height:none}}@media print{.top,.toolbar,.edit,.notice{display:none!important}.layout{display:block;margin:0;padding:0}.preview{position:static;max-height:none;overflow:visible}.sheet{border:0;width:100%;max-width:none;min-height:0;padding:0}@page{size:letter;margin:0.55in}}
</style></head><body><header class="top"><h1>Waiter Briefing — Event Editor</h1><p>Change event information once; export structured data for the approved PDF generator.</p></header><div class="toolbar"><button class="btn primary" id="save">Download event JSON</button><button class="btn" id="loadBtn">Import event JSON</button><input id="file" type="file" accept=".json,application/json" hidden><button class="btn" id="print">Print browser preview</button><button class="btn" id="reset">Restore demonstration</button><small id="status">Demonstration event loaded</small></div><main class="layout"><div class="edit" id="forms"></div><div class="preview"><div class="notice">This is a convenient <b>content preview</b>, not a pixel-exact rendering of the approved PDF. For final production use the included PDF generator.</div><div class="sheet" id="sheet"></div></div></main><script>
const SAMPLE={"event_title":"Sample Event — Demonstration Only","captains":"Sample Captain (lead)","planner":"Sample Planner","planner_assistant":"","timeline":[{"label":"Cocktails","time":"6:00"},{"label":"Dinner","time":"7:00"},{"label":"End","time":"10:00"}],"beverages":[{"category":"White Wine","items":[{"name":"Sample White Wine","details":""}]},{"category":"Red Wine","items":[{"name":"Sample Red Wine","details":""}]}],"menu":[{"course":"1st Course","method":"plated","items":[{"name":"Sample Garden Salad","details":"Mixed greens, vinaigrette"}]},{"course":"Entrée","method":"plated","choice":false,"space_before":4,"items":[{"name":"Sample Main Course","details":"Seasonal vegetables"}]},{"course":"Coffee","method":"on request","items":[{"name":"","details":"Regular, decaf, tea"}]}],"steps_of_service":[{"trigger":"ACS (at Captain’s Signal)","text":"<b>Waiters</b> report to assigned tables."},{"trigger":"ACS","text":"<b>Waiters</b> line up for first course."}]};
let data=structuredClone(SAMPLE);const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeMarkup(s){return esc(s).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>');}
function input(label,value,path,kind='input'){let val=esc(value);return `<div class="field"><label>${esc(label)}</label>${kind==='textarea'?`<textarea data-path="${esc(JSON.stringify(path))}">${val}</textarea>`:`<input data-path="${esc(JSON.stringify(path))}" value="${val}">`}</div>`}
function controls(path,addLabel){return `<div class="buttons"><button class="btn danger" data-remove="${esc(JSON.stringify(path))}">Remove</button></div>`}
function groupList(key,title,fields,subkey){let html=`<section class="card"><h2>${title}</h2>`;data[key].forEach((g,i)=>{html+=`<div class="item"><h3>${title.slice(0,-1)} ${i+1}</h3>`;for(let [field,label,kind] of fields)html+=input(label,g[field]??'', [key,i,field],kind);if(key==='menu')html+=`<div class="row">${input('Choice? (true/false)',String(!!g.choice),[key,i,'choice'])}${input('Space before (points)',g.space_before??0,[key,i,'space_before'])}</div>`;if(subkey){html+=`<div class="nested"><h3>${subkey==='items'?'Items':'Entries'}</h3>`;(g[subkey]||[]).forEach((it,j)=>{html+=`<div class="item">${input('Name',it.name,[key,i,subkey,j,'name'])}${input('Ingredients / description',it.details,[key,i,subkey,j,'details'],'textarea')}`;if(key==='menu')html+=`<div class="row">${input('Alternate course (optional)',it.alternate_course||'',[key,i,subkey,j,'alternate_course'])}${input('Alternate method (optional)',it.alternate_method||'',[key,i,subkey,j,'alternate_method'])}</div>`;html+=controls([key,i,subkey,j])+'</div>'});html+=`<button class="btn" data-add="${esc(JSON.stringify([key,i,subkey]))}">+ Add item</button></div>`}html+=controls([key,i])+'</div>'});return html+`<button class="btn" data-add="${esc(JSON.stringify([key]))}">+ Add ${title.slice(0,-1).toLowerCase()}</button></section>`}
function drawForms(){let h='<section class="card"><h2>Event & management</h2>'+input('Event title',data.event_title,['event_title'])+input('Captains',data.captains,['captains'],'textarea')+`<div class="row">${input('Planner',data.planner,['planner'])}${input('Planner assistant',data.planner_assistant,['planner_assistant'])}</div></section>`;h+='<section class="card"><h2>Timeline</h2>';data.timeline.forEach((r,i)=>h+=`<div class="item"><div class="row">${input('Event',r.label,['timeline',i,'label'])}${input('Time',r.time,['timeline',i,'time'])}</div>${controls(['timeline',i])}</div>`);h+='<button class="btn" data-add="[&quot;timeline&quot;]">+ Add timeline entry</button></section>';h+=groupList('beverages','Beverages',[['category','Category']], 'items');h+=groupList('menu','Menu courses',[['course','Course name'],['method','Service method']], 'items');h+='<section class="card"><h2>Steps of service</h2><p class="hint">Wrap role names in &lt;b&gt;...&lt;/b&gt; to bold them. Order is preserved.</p>';data.steps_of_service.forEach((s,i)=>h+=`<div class="item">${input('Trigger',s.trigger,['steps_of_service',i,'trigger'])}${input('Instruction',s.text,['steps_of_service',i,'text'],'textarea')}${controls(['steps_of_service',i])}</div>`);h+='<button class="btn" data-add="[&quot;steps_of_service&quot;]">+ Add step</button></section>';$('forms').innerHTML=h}
function drawPreview(){let h=`<h1>${esc(data.event_title).toUpperCase()}</h1><div class="management">Captains: ${esc(data.captains)} &nbsp; • &nbsp; Planner: ${esc(data.planner)}${data.planner_assistant?' ('+esc(data.planner_assistant)+')':''}</div><div class="timeline">`;data.timeline.forEach(t=>h+=`<div><strong>${esc(t.label).toUpperCase()}</strong><span>${esc(t.time)}</span></div>`);h+='</div><div class="band">YOUR ASSIGNMENT</div><div class="assignment">NAME: __________ &nbsp; TABLE: ____ &nbsp; PARTNER: ____ &nbsp; COCKTAILS: ____</div><div class="band">BEVERAGES</div>';data.beverages.forEach(g=>(g.items||[]).forEach((it,i)=>h+=`<div class="pr"><span class="cat">${i?'':esc(g.category)}</span><span class="content">${it.name?'<b>'+esc(it.name)+'</b>':''}${it.details?'; '+esc(it.details):''}</span></div>`));h+='<div class="band">MENU</div>';data.menu.forEach(g=>{if(Number(g.space_before))h+=`<div style="height:${Math.min(15,Number(g.space_before))}px"></div>`;(g.items||[]).forEach((it,i)=>{if(i&&g.choice)h+='<div class="or">OR</div>';h+=`<div class="menurow"><span class="course">${esc(it.alternate_course||(!i?g.course:''))}</span><span class="method">${esc(it.alternate_method||(!i?g.method:''))}</span><span class="desc">${it.name?'<b>'+esc(it.name)+'</b>':''}${it.details?'; '+esc(it.details):''}</span></div>`})});h+='<div class="band">STEPS OF SERVICE</div>';data.steps_of_service.forEach(s=>h+=`<div class="service"><span class="trigger">${esc(s.trigger)}</span><span class="instructions">${safeMarkup(s.text)}</span></div>`);$('sheet').innerHTML=h}
function refresh(){drawForms();drawPreview();$('status').textContent='Editing — download JSON to save'}
function setPath(path,val){let x=data;for(let i=0;i<path.length-1;i++)x=x[path[i]];let k=path.at(-1);if(k==='choice')val=val.trim().toLowerCase()==='true';if(k==='space_before')val=Number(val)||0;x[k]=val}
$('forms').addEventListener('input',e=>{let p=e.target.dataset.path;if(!p)return;setPath(JSON.parse(p),e.target.value);drawPreview();$('status').textContent='Unsaved changes'});
$('forms').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.add){let p=JSON.parse(b.dataset.add);let a=data;for(let k of p)a=a[k];if(p.length===1){a.push(p[0]==='timeline'?{label:'New event',time:''}:p[0]==='steps_of_service'?{trigger:'ACS',text:''}:p[0]==='menu'?{course:'New course',method:'',choice:false,space_before:0,items:[]}:{category:'New category',items:[]})}else a.push({name:'',details:''});refresh()}else if(b.dataset.remove){let p=JSON.parse(b.dataset.remove),a=data;for(let k of p.slice(0,-1))a=a[k];a.splice(p.at(-1),1);refresh()}});
$('save').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(data.event_title||'event').replace(/[^a-z0-9]+/gi,'_')+'_event.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='JSON downloaded'};
$('loadBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());for(let k of ['event_title','captains','planner','timeline','beverages','menu','steps_of_service'])if(!(k in obj))throw Error('Missing '+k);data=obj;refresh();$('status').textContent='Imported '+f.name}catch(err){alert('Could not import JSON: '+err.message)}e.target.value=''};
$('reset').onclick=()=>{if(confirm('Replace unsaved edits with the demonstration event?')){data=structuredClone(SAMPLE);refresh()}};$('print').onclick=()=>window.print();refresh();$('status').textContent='Demonstration event loaded';
</script><script>
// Offline support only; event content is never cached or transmitted by this worker.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => {
      console.warn('Offline installation unavailable:', err);
    });
  });
}
</script></body></html>
